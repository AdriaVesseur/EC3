name: Release Windows app
on:
  push:
    tags: ["app-v*", "v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable app version, for example 1.3.1 (must match the checked-out project)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: app-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Validate release version and project versions
        id: release
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:REQUESTED_VERSION.Trim()
            $tag = "app-v$version"
          } else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^(?:app-v|v)(.+)$') { throw 'Use an app-vX.Y.Z tag.' }
            $version = $Matches[1]
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'The app release version must be a stable semantic version: X.Y.Z.'
          }
          [xml]$project = Get-Content -LiteralPath helper/Eurocup3.Helper.csproj -Raw
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $programSource = Get-Content -LiteralPath helper/Program.cs -Raw
          if ($programSource -notmatch 'public const string Version\s*=\s*"([^"\r\n]+)"') {
            throw 'Could not find Program.Version.'
          }
          $programVersion = $Matches[1]
          $installerSource = Get-Content -LiteralPath installer/Eurocup3.iss -Raw
          if ($installerSource -notmatch '(?m)^AppVersion=([^\r\n]+)') {
            throw 'Could not find the installer AppVersion.'
          }
          $installerVersion = $Matches[1]
          foreach ($declared in @($projectVersion, $packageVersion, $programVersion, $installerVersion)) {
            if ($declared -ne $version) {
              throw "Tag/input version $version does not match project version $declared. Run scripts/set-app-version.mjs before publishing."
            }
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
      - run: npm ci
      - run: npm test
      - run: npm run helper:test
      - name: Build self-contained Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            throw 'The Windows runner must provide Inno Setup 6.'
          }
          ./scripts/package-helper.ps1
      - name: Save installer and checksums for review
        uses: actions/upload-artifact@v4
        with:
          name: Eurocup3-app-${{ steps.release.outputs.version }}
          path: |
            release/Eurocup3-Helper-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Create draft release for signing and review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Refusing to replace assets of an already published app release.' }
            gh release upload $env:RELEASE_TAG release/Eurocup3-Helper-Setup.exe release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG release/Eurocup3-Helper-Setup.exe release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --generate-notes --title "Eurocup 3 app $env:RELEASE_VERSION"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the draft app release.' }
